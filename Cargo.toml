[package]
name    = "cosmic-claude-usage"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cosmic-claude-usage"
path = "src/main.rs"

[dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet-token"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dirs       = "5"
chrono     = { version = "0.4", features = ["clock"] }
